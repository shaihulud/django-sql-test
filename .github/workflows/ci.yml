name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run isort -c --diff --settings-file pyproject.toml .
      - run: poetry run black --diff --config pyproject.toml --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            django-version: "4.2.*"
          - python-version: "3.10"
            django-version: "5.0.*"
          - python-version: "3.11"
            django-version: "5.1.*"
          - python-version: "3.12"
            django-version: "5.2.*"
          - python-version: "3.13"
            django-version: "6.0.*"
          - python-version: "3.14"
            django-version: "6.1.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "django==${{ matrix.django-version }}" "sql-metadata>=2.15.0,<3.0.0"
      - run: python runtests.py
